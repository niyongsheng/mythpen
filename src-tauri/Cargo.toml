[package]
name = "mythpen"
version = "0.1.1"
description = "AI 辅助小说创作工具"
authors = ["Nico"]
license = "GPL-3.0-only"
repository = ""
edition = "2021"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-aptabase = "1.3.0"
tauri-plugin-updater = "2.14.0"
tauri-plugin-process = "2.4.0"
sentry = { version = "0.49.5", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
serde_json = "1"
