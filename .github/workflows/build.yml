name: Build & Release

on:
  push:
    tags: ['v*']

env:
  # Used by createUpdaterArtifacts to sign the updater bundles. The matching
  # public key is stored in src-tauri/tauri.conf.json.
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  build-mac-arm:
    name: Build (macOS ARM)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install bun (for sidecar)
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install

      - name: Embed WASM into JS
        run: node scripts/embed-wasm.mjs

      - name: Build sidecar (Express server)
        run: |
          bun build --compile ./server/index.js --outfile src-tauri/binaries/mythpen-server
          mv src-tauri/binaries/mythpen-server src-tauri/binaries/mythpen-server-aarch64-apple-darwin

      - name: Build Tauri app (DMG)
        run: pnpm tauri build

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Mythpen-macOS-ARM
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          compression-level: 0

  build-win-x86:
    name: Build (Windows x86_64)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install bun (for sidecar)
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install

      - name: Embed WASM into JS
        run: node scripts/embed-wasm.mjs

      - name: Build sidecar (Express server)
        shell: bash
        run: |
          bun build --compile ./server/index.js --outfile src-tauri/binaries/mythpen-server
          mv src-tauri/binaries/mythpen-server src-tauri/binaries/mythpen-server-x86_64-pc-windows-msvc.exe

      - name: Build Tauri app (MSI / NSIS)
        run: pnpm tauri build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Mythpen-Windows-x86_64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          compression-level: 0

  build-linux-x86:
    name: Build (Linux x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
          # AppImage bundling (linuxdeploy) needs FUSE. The package name changed
          # with the t64 ABI transition on Ubuntu 24.04+.
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2

      - name: Install bun (for sidecar)
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install

      - name: Embed WASM into JS
        run: node scripts/embed-wasm.mjs

      - name: Build sidecar (Express server)
        run: |
          bun build --compile ./server/index.js --outfile src-tauri/binaries/mythpen-server
          mv src-tauri/binaries/mythpen-server src-tauri/binaries/mythpen-server-x86_64-unknown-linux-gnu

      - name: Build Tauri app (deb / rpm / AppImage)
        run: pnpm tauri build --bundles deb,rpm,appimage
        env:
          # appimagetool is shipped as an AppImage; extract-and-run avoids
          # requiring FUSE on the runner.
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mythpen-Linux-x86_64
          path: src-tauri/target/release/bundle/
          compression-level: 0

  # ─── GitHub Release ───
  release:
    name: Create Release
    needs: [build-mac-arm, build-win-x86, build-linux-x86]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate updater manifest
        run: node scripts/generate-latest-json.mjs
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Mythpen ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            Mythpen-macOS-ARM/dmg/*.dmg
            Mythpen-macOS-ARM/macos/*.app.tar.gz
            Mythpen-macOS-ARM/macos/*.app.tar.gz.sig
            Mythpen-Windows-x86_64/*.exe
            Mythpen-Windows-x86_64/*.exe.sig
            Mythpen-Linux-x86_64/deb/*.deb
            Mythpen-Linux-x86_64/rpm/*.rpm
            Mythpen-Linux-x86_64/appimage/*.AppImage.tar.gz
            Mythpen-Linux-x86_64/appimage/*.AppImage.tar.gz.sig
            latest.json
