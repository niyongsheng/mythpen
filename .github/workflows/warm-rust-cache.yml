name: Warm Rust cache

# GitHub Actions caches are scoped by ref: a run triggered by a tag can only
# reuse caches from that tag or from the default branch, never from another
# tag. Since build.yml only runs on release tags, this workflow compiles the
# same dependency graph on main so tag builds can restore a warm cache.
#
# The rust-cache inputs (workspaces, shared-key) must stay in sync with
# build.yml. rust-cache normalises the crate version out of Cargo.toml and
# Cargo.lock, so the key survives release version bumps.

on:
  schedule:
    # Caches unused for 7 days are evicted; refresh weekly.
    - cron: '0 3 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'src-tauri/build.rs'
      - '.github/workflows/warm-rust-cache.yml'

jobs:
  warm-macos-arm:
    name: Warm (macOS ARM)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install bun (for sidecar)
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install

      - name: Embed WASM into JS
        run: node scripts/embed-wasm.mjs

      - name: Build sidecar (Express server)
        run: |
          bun build --compile ./server/index.js --outfile src-tauri/binaries/mythpen-server
          mv src-tauri/binaries/mythpen-server src-tauri/binaries/mythpen-server-aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: rust-deps
          cache-on-failure: "true"

      # --no-bundle compiles the full dependency graph but skips signing and
      # DMG creation, which is enough to populate the cache.
      - name: Compile Rust dependencies
        run: pnpm tauri build --no-bundle

  warm-win-x86:
    name: Warm (Windows x86_64)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install bun (for sidecar)
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install

      - name: Embed WASM into JS
        run: node scripts/embed-wasm.mjs

      - name: Build sidecar (Express server)
        shell: bash
        run: |
          bun build --compile ./server/index.js --outfile src-tauri/binaries/mythpen-server
          mv src-tauri/binaries/mythpen-server src-tauri/binaries/mythpen-server-x86_64-pc-windows-msvc.exe

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: rust-deps
          cache-on-failure: "true"

      - name: Compile Rust dependencies
        run: pnpm tauri build --no-bundle

  warm-linux-x86:
    name: Warm (Linux x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install bun (for sidecar)
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install

      - name: Embed WASM into JS
        run: node scripts/embed-wasm.mjs

      - name: Build sidecar (Express server)
        run: |
          bun build --compile ./server/index.js --outfile src-tauri/binaries/mythpen-server
          mv src-tauri/binaries/mythpen-server src-tauri/binaries/mythpen-server-x86_64-unknown-linux-gnu

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: rust-deps
          cache-on-failure: "true"

      - name: Compile Rust dependencies
        run: pnpm tauri build --no-bundle
